---
# ============================================================================
#  replicate-all.yml  (self-contained, no role required)
#
#  Enforces a UNIFORM HA policy on a Proxmox VE cluster using local ZFS:
#    * every managed guest is replicated to EVERY other node
#    * every managed guest joins ONE HA group spanning ALL nodes
#
#  Run against ONE node (pmxcfs is cluster-wide, so one node drives it all).
#  Idempotent + safe to re-run on a schedule so new guests self-heal into
#  the policy.
#
#  Usage:
#    ansible-playbook -i inventory.ini replicate-all.yml
#    ansible-playbook -i inventory.ini replicate-all.yml -e "guests=[200,201]"
#    ansible-playbook -i inventory.ini replicate-all.yml --check   # dry run
# ============================================================================

- name: Enforce replicate-all HA policy on Proxmox cluster
  hosts: pve_primary
  gather_facts: false
  become: true

  vars:
    replication_schedule: "*/5"   # min "*/1" (1 min); proxy is config-light
    replication_rate: 0           # MB/s cap; 0 = unlimited (fine on NVMe/LAN)
    ha_group_name: "all-nodes"
    ha_nofailback: 1              # stay put after failover; fail back manually
    guests: []                    # empty = manage ALL guests on ZFS

  tasks:
    - name: Get cluster node list
      ansible.builtin.command: pvesh get /nodes --output-format json
      register: pve_nodes_raw
      changed_when: false

    - name: Parse node names
      ansible.builtin.set_fact:
        cluster_nodes: "{{ pve_nodes_raw.stdout | from_json | map(attribute='node') | list | sort }}"

    - name: Require at least two nodes
      ansible.builtin.assert:
        that: cluster_nodes | length >= 2
        fail_msg: "Need >=2 nodes for replicate-all; found {{ cluster_nodes }}"

    - name: Get all guests (VMs + LXCs) and their current placement
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: pve_resources_raw
      changed_when: false

    - name: Build guest list
      ansible.builtin.set_fact:
        all_guests: "{{ pve_resources_raw.stdout | from_json }}"

    - name: Resolve managed guest set (all, or the -e guests=[...] subset)
      ansible.builtin.set_fact:
        managed_guests: >-
          {{ all_guests | selectattr('vmid', 'in', guests) | list
             if (guests | length > 0) else all_guests }}

    - name: Show the plan
      ansible.builtin.debug:
        msg: "Nodes={{ cluster_nodes }} | guests={{ managed_guests | map(attribute='vmid') | list }}"

    - name: Read existing replication jobs
      ansible.builtin.command: pvesh get /cluster/replication --output-format json
      register: repl_raw
      changed_when: false

    - name: Parse existing replication job ids
      ansible.builtin.set_fact:
        existing_jobs: "{{ repl_raw.stdout | from_json | map(attribute='id') | list }}"

    # (guest x every node), skipping the guest's own home node.
    # Job number = the target node's index in the sorted node list => stable + unique.
    - name: Compute desired replication jobs
      ansible.builtin.set_fact:
        desired_jobs: >-
          {{ desired_jobs | default([]) + [{
               'vmid': item.0.vmid,
               'target': item.1,
               'jobid': (item.0.vmid | string) ~ '-' ~ (cluster_nodes.index(item.1) | string)
             }] }}
      loop: "{{ managed_guests | product(cluster_nodes) | list }}"
      when: item.1 != item.0.node
      loop_control:
        label: "{{ item.0.vmid }} -> {{ item.1 }}"

    - name: Create missing replication jobs (every guest -> every other node)
      ansible.builtin.command: >-
        pvesr create-local-job {{ item.jobid }} {{ item.target }}
        --schedule "{{ replication_schedule }}"
        {{ ('--rate ' ~ (replication_rate | string)) if (replication_rate | int) > 0 else '' }}
      loop: "{{ desired_jobs | default([]) }}"
      loop_control:
        label: "{{ item.jobid }} ({{ item.vmid }} -> {{ item.target }})"
      when: item.jobid not in existing_jobs

    - name: Read existing HA groups
      ansible.builtin.command: pvesh get /cluster/ha/groups --output-format json
      register: ha_groups_raw
      changed_when: false

    - name: Create all-nodes HA group if missing
      ansible.builtin.command: >-
        ha-manager groupadd {{ ha_group_name }}
        --nodes "{{ cluster_nodes | join(',') }}"
        --nofailback {{ ha_nofailback }}
      when: ha_group_name not in (ha_groups_raw.stdout | from_json | map(attribute='group') | list)

    - name: Ensure HA group spans every node (heal drift if a node was added)
      ansible.builtin.command: >-
        ha-manager groupset {{ ha_group_name }}
        --nodes "{{ cluster_nodes | join(',') }}"
        --nofailback {{ ha_nofailback }}
      changed_when: false

    - name: Read existing HA resources
      ansible.builtin.command: pvesh get /cluster/ha/resources --output-format json
      register: ha_res_raw
      changed_when: false

    - name: Parse HA-managed sids
      ansible.builtin.set_fact:
        ha_sids: "{{ ha_res_raw.stdout | from_json | map(attribute='sid') | list }}"

    # ha-manager wants ct:<id> for LXCs and vm:<id> for QEMU VMs.
    - name: Enroll each guest into the all-nodes HA group
      vars:
        sid: "{{ ((item.type == 'lxc') | ternary('ct', 'vm')) ~ ':' ~ (item.vmid | string) }}"
      ansible.builtin.command: >-
        ha-manager add {{ sid }} --group {{ ha_group_name }} --state started
      loop: "{{ managed_guests }}"
      loop_control:
        label: "{{ item.type }}:{{ item.vmid }}"
      when: sid not in ha_sids

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Replicate-all enforced. nodes={{ cluster_nodes | length }},
          guests={{ managed_guests | length }},
          replication_jobs_desired={{ desired_jobs | default([]) | length }},
          ha_group='{{ ha_group_name }}'. Re-run to self-heal drift.
